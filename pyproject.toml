[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "rog-bot"
dynamic = ["version"]
description = "ro — 로컬 전용 개인 비서 CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
serial = ["pyserial"]

[project.scripts]
ro = "ro.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ro"]

# 버전은 git 태그(vYYYY.M.D, .github/workflows/release.yml이 main 머지 때 붙인다)에서 자동 계산한다.
# 태그 이후 커밋은 2026.10.22.post1.devN 형태라 업그레이드가 항상 새 버전으로 인식된다.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"
raw-options = { version_scheme = "no-guess-dev" }
