[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rog-bot"
version = "0.1.0"
description = "ro — 로컬 전용 개인 비서 CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
serial = ["pyserial"]

[project.scripts]
ro = "ro.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ro"]

[tool.hatch.build.targets.wheel.force-include]
"routing.toml" = "ro/_data/routing.toml"
"bench/tasks.example.json" = "ro/_data/tasks.example.json"
