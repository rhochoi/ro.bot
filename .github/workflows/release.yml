# PR과 main 푸시에서 테스트를 돌리고, main에 머지되면 날짜 버전 태그(vYYYY.M.D, 같은 날 여러 번이면 .1, .2 …)와 Release를 만든다.
# 패키지 버전은 setuptools-scm이 이 태그에서 계산하므로 사람이 버전을 고칠 일이 없다.
name: release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

# 태그 번호가 겹치지 않게 main 푸시만 한 줄로 세우고, PR 검사는 PR마다 따로 돈다
concurrency:
  group: ${{ github.event_name == 'push' && 'release' || format('pr-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (태그는 바뀔 수 있어 커밋으로 고정)
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
      - name: test
        # 일부 테스트가 pytest 방식(tmp_path·monkeypatch)이라 pytest로 돌린다. unittest 방식 테스트도 함께 실행된다.
        # 펫 화면 테스트(test_pet_slash·test_pet_ui)는 playwright와 axe가 있어야 돌고, 없으면 조용히 건너뛰므로 여기서 설치한다
        run: |
          python -m pip install pytest playwright==1.63.0
          python -m playwright install chromium
          npm install --no-save --no-audit --no-fund axe-core@4.10.2
          RO_AXE_JS="$PWD/node_modules/axe-core/axe.min.js" python -m pytest -q -rs
      - name: wheel contents
        # 설치본(uv tool·pipx)에도 훅·Swift 호스트가 들어가는지 본다. 체크아웃에서만 되는 경로 가정을 막는다
        run: |
          python -m pip install build
          python -m build --wheel -o dist .
          for f in ro/hooks/ro_guard.py ro/pet_mac.swift ro/ocr_mac.swift; do
            unzip -l dist/*.whl | grep -q " $f$" || { echo "wheel에 $f 없음"; exit 1; }
          done
      - name: tag and release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git tag --points-at HEAD | grep -q '^v'; then
            echo "이미 태그가 있음"; exit 0
          fi
          base="v$(date -u +%Y.%-m.%-d)"
          tag="$base"; n=0
          while git rev-parse -q --verify "refs/tags/$tag" >/dev/null; do
            n=$((n + 1)); tag="$base.$n"
          done
          git tag "$tag"
          git push origin "$tag"
          gh release create "$tag" --generate-notes --title "$tag"
